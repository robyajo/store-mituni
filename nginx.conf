server {
       server_name store.mituni.id www.store.mituni.id;

       # Redirect HTTP ke HTTPS jika SSL aktif
       # return 301 https://$host$request_uri;

       # Allow bigger headers (fix upstream sent too big header)
       proxy_buffer_size 128k;
       proxy_buffers 4 256k;
       proxy_busy_buffers_size 256k;
       large_client_header_buffers 4 64k;

       # Gzip compression
       gzip on;
       gzip_proxied any;
       gzip_comp_level 4;
       gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/x-icon image/svg+xml;

       # Cache static Next.js assets
       location /_next/static/ {
              proxy_pass http://127.0.0.1:3005;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_cache_bypass $http_upgrade;
              expires 365d;
              access_log off;
              add_header Cache-Control "public, max-age=31536000, immutable";
       }

       # Main Next.js application
       location / {
              proxy_pass http://127.0.0.1:3005;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;

              # Timeout settings
              proxy_read_timeout 300s;
              proxy_connect_timeout 60s;
              proxy_send_timeout 60s;

              # Hindari masalah payload
              client_max_body_size 10m;
              proxy_request_buffering on;
       }
}
